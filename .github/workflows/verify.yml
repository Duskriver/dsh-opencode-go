name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Compatibility coverage (deliberate scope):
# - `core` is the full acceptance path (typecheck, check:dist, the full Vitest suite,
#   installed-package smoke) against the pinned development baseline
#   DSH 0.2.1-rc.5 / Cordis 4.0.5 / Schemastery 3.18.5.
# - The installed DSH 0.2.2-rc.1 runtime (Cordis 4.1.0, Schemastery 3.19.0) has
#   only been exercised manually through the headless CLI; its Web/client
#   surface is not covered by CI yet. See docs/verification.md.
# - TODO(compat): add an advisory `compat` job (`continue-on-error: true`) once
#   the official CLI install path is validated: pack this package, install it
#   with @deepseek-ai/dsh@0.2.2-rc.1 into a temporary consumer, then run
#   `node --expose-internals scripts/installed-smoke.mjs <consumer>` and
#   `node scripts/headless-smoke.mjs <consumer>`. Keeping the job advisory
#   preserves a green default run; docs/verification.md tracks the pending work.

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --strict-peer-deps
      - run: npm run verify
      - run: npm run check:pack
